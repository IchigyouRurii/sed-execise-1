<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        :root {
            color-scheme: light;
            --page: #f5f3ec;
            --surface: #fffefa;
            --ink: #24332d;
            --muted: #617168;
            --line: #dce4da;
            --accent: #326b55;
            --accent-dark: #285641;
            --accent-soft: #e8f2e9;
            --danger: #a94c47;
            --shadow: 0 16px 40px rgba(41, 65, 50, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(circle at 90% 0%, #e8efe4 0, transparent 34%), var(--page);
            min-height: 100vh;
            color: var(--ink);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 38px 28px 48px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2.1rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.045em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.98rem;
            color: var(--muted);
        }

        .main-content {
            display: grid;
            grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
            gap: 22px;
            flex: 1;
        }

        .sidebar {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .note-editor {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 560px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            background: var(--accent-dark);
            box-shadow: 0 6px 16px rgba(50, 107, 85, 0.22);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 1px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            background: #f7f8f3;
        }

        .note-item:hover {
            border-color: #acc9b5;
            transform: translateX(3px);
        }

        .note-item.active {
            border-color: #a9c6b1;
            background: var(--accent-soft);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: var(--ink);
        }

        .note-preview {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .editor-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.65rem;
            letter-spacing: -0.025em;
            color: var(--ink);
            overflow-wrap: anywhere;
        }

        .editor-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }

        .language-select {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            font-size: 14px;
            min-width: 120px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: var(--accent);
            color: white;
        }

        .btn-translate {
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .btn-translate:hover {
            background: #d9eadc;
        }

        .btn:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        .btn-save:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #fff;
            color: var(--danger);
            border-color: #eccbc7;
        }

        .btn-delete:hover {
            background: #fff1ef;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--ink);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            background: #fff;
            color: var(--ink);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }

        .error {
            background: #fff1ef;
            color: #8c3935;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eccbc7;
        }

        .success {
            background: var(--accent-soft);
            color: var(--accent-dark);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bcd6c2;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .editor-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .editor-actions {
                justify-content: flex-start;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 24px 16px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }

            .note-editor {
                min-height: 460px;
            }
        }

        @media (max-width: 480px) {
            .editor-actions {
                width: 100%;
            }

            .language-select {
                flex: 1 1 100%;
            }

            .btn {
                flex: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .new-note-btn, .note-item, .btn {
                transition: none;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #edf1e9;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #9dbcaa;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="language-select" id="targetLanguage" aria-label="Target language">
                            <option value="zh">Chinese</option>
                            <option value="en">English</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn">🌐 Translate</button>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.isTranslating = false;
                this.saveTimeout = null;
                this.messageTimeout = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                const autoSave = () => {
                    clearTimeout(this.saveTimeout);
                    this.saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList(query = document.getElementById('searchBox').value) {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                const searchTerm = query.trim().toLowerCase();
                const filteredNotes = searchTerm ? this.notes.filter(note =>
                    (note.title && note.title.toLowerCase().includes(searchTerm)) ||
                    (note.content && note.content.toLowerCase().includes(searchTerm))
                ) : this.notes;

                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                if (this.isTranslating) return;
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                clearTimeout(this.saveTimeout);
                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
            }

            createNewNote() {
                if (this.isTranslating) return;
                clearTimeout(this.saveTimeout);
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
            }

            hideEditor() {
                clearTimeout(this.saveTimeout);
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
            }

            setTranslationBusy(busy) {
                this.isTranslating = busy;
                for (const id of ['targetLanguage', 'translateBtn', 'saveBtn', 'deleteBtn', 'noteTitle', 'noteContent', 'newNoteBtn']) {
                    document.getElementById(id).disabled = busy;
                }
                document.getElementById('translateBtn').textContent = busy ? '🌐 Translating...' : '🌐 Translate';
            }

            async translateNote() {
                if (!this.currentNote || this.isTranslating) return;

                const titleInput = document.getElementById('noteTitle');
                const contentInput = document.getElementById('noteContent');
                const title = titleInput.value;
                const content = contentInput.value;
                if (!title.trim() && !content.trim()) {
                    this.showMessage('Please enter a title or content to translate', 'error');
                    return;
                }

                clearTimeout(this.saveTimeout);
                this.setTranslationBusy(true);
                this.showMessage('Translating note...', 'loading');

                try {
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title,
                            content,
                            target_language: document.getElementById('targetLanguage').value
                        })
                    });
                    const result = await response.json().catch(() => null);
                    if (!response.ok) throw new Error(result?.error || 'Failed to translate note');
                    if (!result || typeof result.title !== 'string' || typeof result.content !== 'string') {
                        throw new Error('Translation service returned an invalid result');
                    }

                    titleInput.value = result.title;
                    contentInput.value = result.content;
                    document.getElementById('editorTitle').textContent = result.title || 'Untitled Note';
                    this.showMessage('Translation ready. Review and save your note.', 'success');
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    this.setTranslationBusy(false);
                }
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote || this.isTranslating) return;
                if (!isAutoSave) clearTimeout(this.saveTimeout);

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;
                clearTimeout(this.saveTimeout);

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                this.renderNotesList(query);
            }

            showMessage(message, type) {
                clearTimeout(this.messageTimeout);
                const messageArea = document.getElementById('messageArea');
                const messageElement = document.createElement('div');
                messageElement.className = type;
                messageElement.textContent = message;
                messageArea.replaceChildren(messageElement);
                
                if (type === 'success') {
                    this.messageTimeout = setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                clearTimeout(this.messageTimeout);
                this.messageTimeout = null;
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
